<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iago.carneiro - Using noise and Points</title>
  <style>
    .header { height: unset !important; }
    .logo { font-size: 1.1rem !important; }
    .breadcrumb-separator,
    .logo-item { color: #f1f1f1; }

    .noise-help-toggle,
    .noise-help {
      position: fixed;
      left: 1.25rem;
      z-index: 20;
      color: #161616;
      font-family: 'Mulish', sans-serif;
    }

    .noise-help-toggle {
      bottom: 1.25rem;
      border: 1px solid rgba(22, 22, 22, 0.45);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      background: rgba(241, 241, 241, 0.88);
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }

    .noise-help-toggle:hover {
      background: #f1f1f1;
    }

    .noise-help {
      bottom: 4.25rem;
      width: min(360px, calc(100vw - 2.5rem));
      padding: 1rem 1.1rem;
      border: 1px solid rgba(22, 22, 22, 0.2);
      border-radius: 0.35rem;
      background: rgba(241, 241, 241, 0.94);
      box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.12);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .noise-help h2 {
      margin-bottom: 0.65rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .noise-help p + p {
      margin-top: 0.55rem;
    }

    .noise-help code {
      padding: 0.05rem 0.2rem;
      border-radius: 0.2rem;
      background: rgba(22, 22, 22, 0.08);
      font-family: Consolas, monospace;
      font-size: 0.78rem;
    }
  </style>
</head>
<body></body>
</html>
